<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <title>Formulaire</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.14.0/css/all.min.css"
    />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div class="container" id="container">
      <div class="form-container sign-up-container">
        <form action="#">
          <h1>Créer un compte</h1>
          <div class="social-container">
            <a href="#" class="social"><i class="fab fa-facebook-f"></i></a>
            <a href="#" class="social"><i class="fab fa-google-plus-g"></i></a>
            <a href="#" class="social"><i class="fab fa-linkedin-in"></i></a>
          </div>
          <span>ou connecte-toi avec ton e-mail</span>
          <input type="text" placeholder="Name" />
          <input type="email" placeholder="Email" />
          <input type="password" placeholder="Password" />
          <button>S'enregistrer</button>
        </form>
      </div>

      <div class="form-container sign-in-container">
        <form action="#">
          <h1>Se connecter</h1>
          <div class="social-container">
            <a href="#" class="social"><i class="fab fa-facebook-f"></i></a>
            <a href="#" class="social"><i class="fab fa-google-plus-g"></i></a>
            <a href="#" class="social"><i class="fab fa-linkedin-in"></i></a>
          </div>
          <span>Utilise tes identifiants</span>
          <input type="email" placeholder="Email" />
          <input type="password" placeholder="Mot de passe" id="password" />
          <span><i id="showPassword" class="far fa-eye"></i></span>
          <!--<input id="showPassword" type="checkbox" />-->
          <a href="#">Mot de passe oublié ?</a>
          <button>Se connecter</button>
        </form>
      </div>
      <div class="overlay-container">
        <div class="overlay">
          <div class="overlay-panel overlay-left">
            <h1>Bonjour!</h1>
            <p>Pour rester avec nous, connecte-toi</p>
            <button class="btnSign" id="signIn">Se connecter</button>
          </div>
          <div class="overlay-panel overlay-right">
            <h1>Bonjour</h1>
            <p>Entre tes détails et rejoins-nous</p>
            <button class="btnSign" id="signUp">Créer un compte</button>
          </div>
        </div>
      </div>
    </div>
    <script src="./index.js"></script>
  </body>
</html>
